services:
  backend:
    build: ./backend
    container_name: clinics-backend
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PORT: 3001
    ports:
      - '3001:3001'
    networks:
      - app-network
    volumes:
      - ./backend/uploads:/app/uploads
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_API_URL: http://backend:3001
    container_name: clinics-frontend
    env_file:
      - .env
    ports:
      - '3000:3000'
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    container_name: clinics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinics
      POSTGRES_USER: clinics
      POSTGRES_PASSWORD: clinics_password
    ports:
      - "5433:5432"
    networks:
      - app-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinics -d clinics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: